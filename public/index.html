<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yamato Chat</title>
<style>
:root{
  --bg:#0f1117;--panel:#171a22;--panel2:#1d212b;--line:#2a3040;
  --text:#f2f4f8;--muted:#9aa3b5;--accent:#5b67f1;--accent2:#3b82f6;
  --hover:#252b38;--danger:#ef6464;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:220px 1fr 210px;height:100vh}
.sidebar,.members{background:var(--panel);border-color:var(--line)}
.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{height:60px;padding:18px;font-weight:800;border-bottom:1px solid var(--line)}
.brand span{color:var(--accent)}
.channels{padding:14px 10px;overflow:auto}
.section{font-size:11px;color:var(--muted);font-weight:700;padding:8px}
.channel{padding:10px 12px;border-radius:7px;color:#c8ced9;cursor:pointer;margin:2px 0}
.channel:hover,.channel.active{background:var(--hover);color:white}
.me{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent2);font-weight:700;flex:none}
.meinfo{min-width:0}.meinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;color:#67d391}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.header{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;font-weight:700}
.header small{margin-left:10px;color:var(--muted);font-weight:400}
.messages{flex:1;min-height:0;overflow:auto;padding:18px 22px}
.message{display:flex;gap:11px;margin:0 0 16px}
.message-actions{display:inline-flex;gap:4px;margin-left:8px;opacity:1;pointer-events:auto}
.message-action{border:0;background:#2a2e39;color:#cbd1df;border-radius:5px;width:25px;height:23px;cursor:pointer;font-size:13px;display:grid;place-items:center;padding:0}
.message-action:hover{background:#3a3f4d;color:#fff}
.message-action.delete:hover{background:#a83d45}
.edited{font-size:10px;color:var(--muted);margin-left:4px}

.message .avatar{width:36px;height:36px}
.msgbody{min-width:0}.msghead{display:flex;gap:8px;align-items:baseline}
.msghead b{font-size:14px}.time{font-size:10px;color:var(--muted)}
.text{margin-top:3px;white-space:pre-wrap;word-break:break-word;color:#e1e5ed}
.system{color:var(--muted);font-size:13px;text-align:center;margin:10px}
.composer{flex:0 0 auto;padding:12px 18px 18px}
.composer form{display:flex;align-items:stretch;height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;padding:0 14px;font-size:14px}
.composer button{border:0;background:var(--accent);color:white;padding:0 18px;font-weight:700;cursor:pointer}
.composer .attach-btn{flex:0 0 44px;width:44px;height:44px;padding:0;background:var(--accent);border-radius:0;display:grid;place-items:center;font-size:25px;line-height:1}
.composer .send-btn{flex:0 0 64px}
.members{border-left:1px solid var(--line);padding:16px;overflow:auto}
.members h3{font-size:12px;color:var(--muted);margin:4px 0 12px}
.member{display:flex;align-items:center;gap:9px;padding:7px 0}
.dot{width:8px;height:8px;border-radius:50%;background:#53d889;box-shadow:0 0 0 3px #1d3a2a}
.membername{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.overlay{position:fixed;inset:0;background:#080a0fee;display:grid;place-items:center;z-index:10;padding:20px;overflow:auto}
.auth-card{width:min(430px,92vw);background:#303238;border-radius:12px;padding:28px 24px;box-shadow:0 12px 50px #0008}
.auth-card h1{text-align:center;font-size:23px;margin:0 0 24px}
.auth-card label{display:block;color:#d8dbe3;font-size:13px;margin:13px 0 6px}
.auth-card input,.auth-card textarea{width:100%;padding:11px 12px;border:0;border-radius:7px;background:#1f2024;color:white;outline:0;font:inherit}
.auth-card input:focus,.auth-card textarea:focus{box-shadow:0 0 0 2px #6974ff}
.auth-card textarea{resize:vertical;min-height:78px}
.password-wrap{position:relative}
.password-wrap input{padding-right:44px}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#bfc5d1;cursor:pointer;font-size:16px}
.auth-btn{width:100%;margin-top:18px;padding:12px;border:0;border-radius:7px;background:#5b67f1;color:white;font-weight:700;font-size:15px;cursor:pointer}
.auth-btn:hover{filter:brightness(1.08)}
.auth-switch{text-align:center;color:#9aa3b5;font-size:13px;margin:28px 0 0}
.auth-switch button{border:0;background:none;color:#32b5ff;cursor:pointer;font:inherit}
.auth-error{min-height:18px;margin-top:10px;color:#ff8d8d;font-size:13px;text-align:center}
.gate-note{color:#8f96a7;font-size:11px;margin-top:4px}
.hidden{display:none!important}

.profile-panel{position:fixed;right:18px;bottom:70px;width:min(330px,calc(100vw - 36px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;z-index:4;box-shadow:0 12px 40px #0008}
.profile-panel h3{margin:0 0 12px}.profile-panel .row{margin:10px 0}.profile-panel .label{font-size:11px;color:var(--muted)}.profile-panel .value{word-break:break-all}
.profile-panel button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:7px;cursor:pointer;background:var(--hover);color:white}
.profile-panel .logout{background:#7a3030}
.profile-avatar-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--accent2);display:grid;place-items:center;font-size:26px;font-weight:700;margin-bottom:10px}
.profile-edit{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.profile-edit label{display:block;font-size:11px;color:var(--muted);margin:8px 0 5px}
.profile-edit input,.profile-edit textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#1f2028;color:white;font:inherit}
.profile-edit textarea{resize:vertical;min-height:70px}
.profile-edit button{margin-top:8px;background:var(--accent)}
.profile-edit .secondary{background:var(--hover)}
.file-row{display:flex;gap:8px;align-items:center}
.attach-btn{width:42px;border:0;border-radius:7px;background:var(--hover);color:white;cursor:pointer;font-size:20px}
.attachment{margin-top:8px;width:min(460px,calc(100vw - 90px));max-width:100%;box-sizing:border-box;background:#1f222b;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.attachment-image{display:block;width:auto;max-width:min(100%,520px);max-height:360px;height:auto;object-fit:contain;background:#11131a;border-radius:7px}
.attachment-actions{display:flex;align-items:center;gap:10px;padding:7px 9px}
.attachment-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.attachment-action,.attachment-download{border:0;background:var(--hover);color:#dbe5ff;text-decoration:none;border-radius:6px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.attachment-file{display:flex;align-items:center;gap:10px;padding:10px}
.attachment-file-icon{width:42px;height:42px;border-radius:7px;background:#2a2e39;display:grid;place-items:center;font-size:21px;flex:0 0 auto}
.attachment-file-info{min-width:0;flex:1}
.attachment-file-info .attachment-name{font-weight:600}
.attachment-meta{font-size:11px;color:var(--muted);margin-top:3px}
.pending-attachment{display:none;align-items:flex-start;gap:10px;margin:0 0 8px;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;max-width:520px}
.pending-attachment.show{display:flex}
.pending-attachment .pending-preview{display:none;width:88px;height:66px;border-radius:6px;object-fit:cover;background:#11131a;flex:0 0 auto}
.pending-attachment.image-pending .pending-preview{display:block}
.pending-attachment .pending-info{min-width:0;flex:1;padding-top:2px}
.pending-attachment .pending-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pending-attachment button{width:28px;height:28px;padding:0;background:var(--hover);border:0;border-radius:6px;color:white;cursor:pointer}

@media(max-width:800px){.app{grid-template-columns:170px 1fr}.members{display:none}}
@media(max-width:560px){.app{grid-template-columns:1fr}.sidebar{display:none}.messages{padding:14px}.attachment{width:100%}.attachment-image{max-height:260px}}
</style>
</head>
<body>

<div id="authOverlay" class="overlay">
  <div id="loginCard" class="auth-card">
    <h1>Yamato Chat にログイン</h1>
    <form id="loginForm">
      <label for="loginUsername">ユーザー名</label>
      <input id="loginUsername" maxlength="24" placeholder="ユーザー名" autocomplete="username" required>

      <label for="loginPassword">パスワード</label>
      <div class="password-wrap">
        <input id="loginPassword" type="password" maxlength="128" placeholder="パスワード" autocomplete="current-password" required>
        <button type="button" class="eye" data-target="loginPassword">◉</button>
      </div>

      <label for="loginGate">共通ゲートパスワード</label>
      <div class="password-wrap">
        <input id="loginGate" type="password" maxlength="128" placeholder="共通共通ゲートパスワード" required>
        <button type="button" class="eye" data-target="loginGate">◉</button>
      </div>

      <div id="loginError" class="auth-error"></div>
      <button class="auth-btn">ログイン</button>
    </form>
    <div class="auth-switch">アカウントを持っていない場合は <button id="showRegister">新規登録</button></div>
  </div>

  <div id="registerCard" class="auth-card hidden">
    <h1>Yamato Chat に新規登録</h1>
    <form id="registerForm">
      <label for="regDisplayName">表示名 <b>*</b></label>
      <input id="regDisplayName" maxlength="24" placeholder="チャットで表示される名前" autocomplete="nickname" required>

      <label for="regUsername">ユーザー名 <b>*</b></label>
      <input id="regUsername" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="半角英数字と _ のみ（ログインに使用）" autocomplete="username" required>

      <label for="regPassword">パスワード <b>*</b></label>
      <div class="password-wrap">
        <input id="regPassword" type="password" maxlength="128" minlength="4" placeholder="4文字以上" autocomplete="new-password" required>
        <button type="button" class="eye" data-target="regPassword">◉</button>
      </div>

      <label for="regGate">共通ゲートパスワード</label>
      <div class="password-wrap">
        <input id="regGate" type="password" maxlength="128" minlength="4" placeholder="共通共通ゲートパスワード" required>
        <button type="button" class="eye" data-target="regGate">◉</button>
      </div>
      <div class="gate-note">全員共通のYamato Chat共通ゲートパスワードです。</div>

      <label for="regBio">自己紹介（任意）</label>
      <textarea id="regBio" maxlength="500" placeholder="簡単な自己紹介"></textarea>

      <div id="registerError" class="auth-error"></div>
      <button class="auth-btn">登録</button>
    </form>
    <div class="auth-switch">すでにアカウントをお持ちの場合は <button id="showLogin">ログイン</button></div>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">Yamato <span>Chat</span></div>
    <div class="channels">
      <div class="section">CHANNELS</div>
      <div class="channel active" data-channel="general"># general</div>
      <div class="channel" data-channel="chat"># 雑談</div>
      <div class="channel" data-channel="game"># ゲーム</div>
    </div>
    <div class="me" id="profileButton">
      <div class="avatar" id="myAvatar">?</div>
      <div class="meinfo"><b id="myName">Guest</b><div class="status">● オンライン</div></div>
    </div>
  </aside>

  <main class="main">
    <div class="header"># <span id="channelName">general</span><small>リアルタイムチャット</small></div>
    <div id="messages" class="messages"></div>
    <div class="composer">
      <div id="pendingAttachment" class="pending-attachment">
        <img id="pendingAttachmentPreview" class="pending-preview" alt="">
        <div class="pending-info">
          <div id="pendingAttachmentName" class="pending-name"></div>
          <div id="pendingAttachmentSize" class="attachment-meta"></div>
        </div>
        <button type="button" id="clearAttachment" title="添付を取り消す">×</button>
      </div>
      <form id="messageForm">
        <input type="file" id="fileInput" hidden>
        <button type="button" class="attach-btn" id="attachButton" title="画像・ファイルを添付">＋</button>
        <input id="messageInput" maxlength="2000" placeholder="# general にメッセージを送信" autocomplete="off">
        <button type="submit" class="send-btn">送信</button>
      </form>
      <div id="fileStatus" class="attachment-meta"></div>
    </div>
  </main>

  <aside class="members">
    <h3 id="memberCount">ONLINE — 0</h3>
    <div id="memberList"></div>
  </aside>
</div>

<div id="profilePanel" class="profile-panel hidden">
  <h3>プロフィール</h3>
  <div class="profile-avatar-preview" id="profileAvatar">?</div>
  <div class="row"><div class="label">表示名</div><div class="value" id="profileName"></div></div>
  <div class="row"><div class="label">ユーザー名</div><div class="value" id="profileUsername"></div></div>
  <div class="row"><div class="label">自己紹介</div><div class="value" id="profileBio"></div></div>

  <div class="profile-edit">
    <label for="editDisplayName">表示名</label>
    <input id="editDisplayName" maxlength="24">
    <label for="editBio">自己紹介</label>
    <textarea id="editBio" maxlength="500"></textarea>
    <label for="avatarInput">アイコン</label>
    <input id="avatarInput" type="file" accept="image/*">
    <button id="saveProfileButton">プロフィールを保存</button>
    <button id="logoutButton" class="logout">ログアウト</button>
  </div>
</div>

<script>
let ws;
let myId = "";
let currentChannel = "general";
let account = null;
let reconnectTimer = null;

const $ = id => document.getElementById(id);
const messages = $("messages");

function setAuthVisible(show) {
  $("authOverlay").classList.toggle("hidden", !show);
}

function showLogin() {
  $("loginCard").classList.remove("hidden");
  $("registerCard").classList.add("hidden");
  $("loginError").textContent = "";
  $("registerError").textContent = "";
  $("loginUsername").focus();
}

function showRegister() {
  $("loginCard").classList.add("hidden");
  $("registerCard").classList.remove("hidden");
  $("loginError").textContent = "";
  $("registerError").textContent = "";
  $("regDisplayName").focus();
}

function setAvatarElement(el, url, fallbackName) {
  el.innerHTML = "";
  if (url) {
    const img = document.createElement("img");
    img.src = url;
    img.alt = "";
    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "cover";
    img.style.borderRadius = "50%";
    el.appendChild(img);
  } else {
    el.textContent = (fallbackName || "?").slice(0,1).toUpperCase();
  }
}

function setAccount(data) {
  account = data;
  const displayName = account.display_name || account.displayName || "";
  const avatarUrl = account.avatar_url || account.avatarUrl || null;
  $("myName").textContent = displayName;
  setAvatarElement($("myAvatar"), avatarUrl, displayName);
  setAvatarElement($("profileAvatar"), avatarUrl, displayName);
  $("profileName").textContent = displayName;
  $("profileUsername").textContent = "@" + account.username;
  $("profileBio").textContent = account.bio || "自己紹介はまだありません";
  $("editDisplayName").value = displayName;
  $("editBio").value = account.bio || "";
}

async function api(url, options = {}) {
  const response = await fetch(url, {
    credentials: "same-origin",
    ...options,
    headers: {"Content-Type":"application/json", ...(options.headers || {})}
  });
  const data = await response.json().catch(() => ({ok:false,error:"サーバーから不正な応答が返りました"}));
  if (!response.ok) throw new Error(data.error || "処理に失敗しました");
  return data;
}

async function checkSession() {
  // Always require an explicit login when the page is opened.
  // The existing server session is not automatically restored in the browser.
  account = null;
  if (ws) {
    try { ws.close(); } catch {}
    ws = null;
  }
  setAuthVisible(true);
  showLogin();
}

async function login(e) {
  e.preventDefault();
  $("loginError").textContent = "ログイン中…";
  try {
    const data = await api("/api/login", {
      method:"POST",
      body:JSON.stringify({
        username:$("loginUsername").value.trim(),
        password:$("loginPassword").value,
        gatePassword:$("loginGate").value
      })
    });
    setAccount(data.account);
    setAuthVisible(false);
    $("loginForm").reset();
    connect();
    $("messageInput").focus();
  } catch (err) {
    $("loginError").textContent = err.message;
  }
}

async function register(e) {
  e.preventDefault();
  $("registerError").textContent = "登録中…";
  try {
    const data = await api("/api/register", {
      method:"POST",
      body:JSON.stringify({
        displayName:$("regDisplayName").value.trim(),
        username:$("regUsername").value.trim(),
        password:$("regPassword").value,
        gatePassword:$("regGate").value,
        bio:$("regBio").value.trim()
      })
    });
    setAccount(data.account);
    setAuthVisible(false);
    $("registerForm").reset();
    connect();
    $("messageInput").focus();
  } catch (err) {
    $("registerError").textContent = err.message;
  }
}

function connect() {
  if (!account) return;
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${protocol}//${location.host}`);

  ws.onopen = () => {
    $("messages").dataset.connected = "1";
  };

  ws.onmessage = e => {
    const data = JSON.parse(e.data);

    if (data.type === "auth_required") {
      setAuthVisible(true);
      showLogin();
      return;
    }

    if (data.type === "profile_updated") {
      if (data.account) {
        setAccount({
          username: data.account.username,
          display_name: data.account.displayName,
          bio: data.account.bio,
          avatar_url: data.account.avatarUrl
        });
        updateVisibleAvatars(data.account.avatarUrl || null);
      }
      return;
    }

    if (data.type === "welcome") {
      myId = data.id;
      if (data.account) {
        setAccount({
          id:data.account.id,
          username:data.account.username,
          display_name:data.account.displayName,
          bio:data.account.bio,
          chatUserId:data.account.chatUserId,
          avatar_url:data.account.avatarUrl
        });
      }
      renderHistory(data.messages || []);
      return;
    }

    if (data.type === "channel_history") {
      currentChannel = data.channel;
      renderHistory(data.messages || []);
      return;
    }

    if (data.type === "message") {
      if (data.channel === currentChannel) appendMessage(data.message);
      return;
    }

    if (data.type === "message_edited") {
      if (data.channel === currentChannel) updateMessageInDom(data.messageId, data.text, data.editedAt);
      return;
    }

    if (data.type === "message_deleted") {
      if (data.channel === currentChannel) removeMessageFromDom(data.messageId);
      return;
    }

    if (data.type === "system") {
      appendSystem(data.text);
      return;
    }

    if (data.type === "users") {
      renderUsers(data.users);
    }
  };

  ws.onclose = () => {
    if (!account) return;
    appendSystem("サーバーとの接続が切れました。再接続を試みています…");
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 2000);
  };
}

function updateVisibleAvatars(url) {
  document.querySelectorAll(".message").forEach(wrap => {
    const nameEl = wrap.querySelector(".msghead b");
    if (!nameEl || !account) return;
    const isMe = nameEl.textContent === (account.display_name || account.displayName);
    if (!isMe) return;
    const avatar = wrap.querySelector(".avatar");
    if (avatar) setAvatarElement(avatar, url, nameEl.textContent);
  });
}

async function downloadAttachment(url, name) {
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error("download failed");
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = name || "download";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
  } catch {
    // Fallback: open the file only if the browser blocks the download fetch.
    window.open(url, "_blank", "noopener");
  }
}

function updateMessageInDom(messageId, textValue, editedAt) {
  const wrap = document.querySelector(`.message[data-message-id="${CSS.escape(messageId)}"]`);
  if (!wrap) return;

  const text = wrap.querySelector(".text");
  if (text) text.textContent = textValue;
  else if (textValue) {
    const t = document.createElement("div");
    t.className = "text";
    t.textContent = textValue;
    wrap.querySelector(".msgbody").appendChild(t);
  }

  let edited = wrap.querySelector(".edited");
  if (!edited) {
    edited = document.createElement("span");
    edited.className = "edited";
    wrap.querySelector(".msghead").appendChild(edited);
  }
  edited.textContent = "(編集済み)";
}

function removeMessageFromDom(messageId) {
  const wrap = document.querySelector(`.message[data-message-id="${CSS.escape(messageId)}"]`);
  if (wrap) wrap.remove();
}

function editOwnMessage(messageId, currentText) {
  const value = window.prompt("メッセージを編集", currentText || "");
  if (value === null) return;
  const text = value.trim();
  if (!text || text === currentText) return;
  if (ws?.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type:"edit_message", messageId, text}));
  }
}

function deleteOwnMessage(messageId) {
  if (!window.confirm("このメッセージを削除しますか？")) return;
  if (ws?.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type:"delete_message", messageId}));
  }
}

function appendMessage(m) {
  const wrap = document.createElement("div");
  wrap.className = "message";
  wrap.dataset.messageId = m.id || "";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  setAvatarElement(avatar, m.avatarUrl, m.user);

  const body = document.createElement("div");
  body.className = "msgbody";

  const head = document.createElement("div");
  head.className = "msghead";

  const name = document.createElement("b");
  name.textContent = m.user;

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = new Date(m.time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});

  head.append(name,time);

  const own = !!account && (
    (!!account.chatUserId && !!m.userId &&
      String(account.chatUserId) === String(m.userId)) ||
    (!m.userId && m.user === (account.display_name || account.displayName))
  );

  if (own && m.id) {
    const actions = document.createElement("span");
    actions.className = "message-actions";

    const edit = document.createElement("button");
    edit.className = "message-action";
    edit.type = "button";
    edit.title = "編集";
    edit.textContent = "✎";
    edit.setAttribute("aria-label", "編集");
    edit.addEventListener("click", () => editOwnMessage(m.id, m.text || ""));

    const del = document.createElement("button");
    del.className = "message-action delete";
    del.type = "button";
    del.title = "削除";
    del.textContent = "🗑";
    del.setAttribute("aria-label", "削除");
    del.addEventListener("click", () => deleteOwnMessage(m.id));

    actions.append(edit,del);
    head.appendChild(actions);
  }

  if (m.editedAt) {
    const edited = document.createElement("span");
    edited.className = "edited";
    edited.textContent = "(編集済み)";
    head.appendChild(edited);
  }

  body.appendChild(head);

  if (m.text) {
    const text = document.createElement("div");
    text.className = "text";
    text.textContent = m.text;
    body.appendChild(text);
  }

  if (m.attachment?.url) {
    const attachment = document.createElement("div");
    attachment.className = "attachment";

    const type = String(m.attachment.type || "application/octet-stream");
    const name = m.attachment.name || "ファイル";
    const isImage = type.startsWith("image/");

    if (isImage) {
      const img = document.createElement("img");
      img.src = m.attachment.url;
      img.alt = name;
      img.loading = "lazy";
      img.className = "attachment-image";
      attachment.appendChild(img);

      const actions = document.createElement("div");
      actions.className = "attachment-actions";

      const info = document.createElement("div");
      info.style.minWidth = "0";
      info.style.flex = "1";

      const label = document.createElement("div");
      label.className = "attachment-name";
      label.textContent = name;

      const size = document.createElement("div");
      size.className = "attachment-meta";
      size.textContent = formatBytes(m.attachment.size);

      info.append(label,size);

      const view = document.createElement("a");
      view.className = "attachment-action";
      view.href = m.attachment.url;
      view.target = "_blank";
      view.rel = "noopener";
      view.textContent = "表示";

      actions.append(info,view);
      attachment.appendChild(actions);
    } else {
      const row = document.createElement("div");
      row.className = "attachment-file";

      const icon = document.createElement("div");
      icon.className = "attachment-file-icon";
      icon.textContent = "📄";

      const info = document.createElement("div");
      info.className = "attachment-file-info";

      const label = document.createElement("div");
      label.className = "attachment-name";
      label.textContent = name;

      const meta = document.createElement("div");
      meta.className = "attachment-meta";
      meta.textContent = formatBytes(m.attachment.size);

      info.append(label,meta);

      const download = document.createElement("button");
      download.type = "button";
      download.className = "attachment-download";
      download.textContent = "↓";
      download.title = "ダウンロード";
      download.addEventListener("click", () => downloadAttachment(m.attachment.url,name));

      row.append(icon,info,download);
      attachment.appendChild(row);
    }

    body.appendChild(attachment);
  }

  wrap.append(avatar,body);
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
}

function formatBytes(size) {
  const n = Number(size) || 0;
  if (n < 1024) return `${n} B`;
  if (n < 1024*1024) return `${(n/1024).toFixed(1)} KB`;
  return `${(n/1024/1024).toFixed(1)} MB`;
}

function appendSystem(text) {
  const el = document.createElement("div");
  el.className = "system";
  el.textContent = text;
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
}

function renderHistory(list) {
  messages.innerHTML = "";
  list.forEach(appendMessage);
}

function renderUsers(users) {
  $("memberCount").textContent = `ONLINE — ${users.length}`;
  $("memberList").innerHTML = "";
  users.forEach(u => {
    const row = document.createElement("div");
    row.className = "member";
    const dot = document.createElement("span");
    dot.className = "dot";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.style.width = "28px";
    avatar.style.height = "28px";
    setAvatarElement(avatar, u.avatarUrl, u.name || u.username);
    const name = document.createElement("span");
    name.className = "membername";
    name.textContent = (u.name || u.username) + (u.id === myId ? " (あなた)" : "");
    row.append(dot,avatar,name);
    $("memberList").appendChild(row);
  });
}

$("saveProfileButton").addEventListener("click", async () => {
  const button = $("saveProfileButton");
  button.disabled = true;
  button.textContent = "保存中…";

  try {
    let data = await api("/api/profile", {
      method: "PATCH",
      body: JSON.stringify({
        displayName: $("editDisplayName").value.trim(),
        bio: $("editBio").value.trim()
      })
    });
    setAccount(data.account);

    const avatarFile = $("avatarInput").files[0];
    if (avatarFile) {
      const form = new FormData();
      form.append("file", avatarFile);
      const response = await fetch("/api/profile/avatar", {
        method: "POST",
        credentials: "same-origin",
        body: form
      });
      const avatarData = await response.json();
      if (!response.ok) throw new Error(avatarData.error || "アイコンの更新に失敗しました");
      setAccount(avatarData.account);
      updateVisibleAvatars(avatarData.account.avatar_url || avatarData.account.avatarUrl || null);
      $("avatarInput").value = "";
    }

    $("profilePanel").classList.add("hidden");
  } catch (err) {
    alert(err.message);
  } finally {
    button.disabled = false;
    button.textContent = "プロフィールを保存";
  }
});

$("attachButton").addEventListener("click", () => $("fileInput").click());

$("fileInput").addEventListener("change", () => {
  const file = $("fileInput").files[0];
  $("fileStatus").textContent = file
    ? `添付: ${file.name} (${formatBytes(file.size)})`
    : "";
});

async function uploadChatFile(file) {
  const form = new FormData();
  form.append("file", file, file.name || "pasted-file");
  const response = await fetch("/api/upload", {
    method: "POST",
    credentials: "same-origin",
    body: form
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "アップロードに失敗しました");
  return data.file;
}

let pendingFile = null;

let pendingPreviewUrl = null;

function setPendingFile(file) {
  if (pendingPreviewUrl) {
    URL.revokeObjectURL(pendingPreviewUrl);
    pendingPreviewUrl = null;
  }

  pendingFile = file || null;
  const box = $("pendingAttachment");
  const name = $("pendingAttachmentName");
  const size = $("pendingAttachmentSize");
  const preview = $("pendingAttachmentPreview");

  box.classList.remove("image-pending");

  if (pendingFile) {
    name.textContent = pendingFile.name || "貼り付けファイル";
    size.textContent = formatBytes(pendingFile.size);

    if (pendingFile.type && pendingFile.type.startsWith("image/")) {
      pendingPreviewUrl = URL.createObjectURL(pendingFile);
      preview.src = pendingPreviewUrl;
      preview.alt = pendingFile.name || "画像";
      box.classList.add("image-pending");
    } else {
      preview.removeAttribute("src");
      preview.alt = "";
    }
    box.classList.add("show");
  } else {
    name.textContent = "";
    size.textContent = "";
    preview.removeAttribute("src");
    preview.alt = "";
    box.classList.remove("show");
    $("fileInput").value = "";
  }
}

$("attachButton").addEventListener("click", () => $("fileInput").click());

$("fileInput").addEventListener("change", () => {
  const file = $("fileInput").files[0] || null;
  setPendingFile(file);
});

$("clearAttachment").addEventListener("click", () => setPendingFile(null));

// Ctrl+V / right-click paste: if the clipboard contains an image/file,
// turn it into the same pending attachment used by the + button.
$("messageInput").addEventListener("paste", e => {
  const items = Array.from(e.clipboardData?.items || []);
  const fileItem = items.find(item => item.kind === "file");
  if (!fileItem) return;

  const file = fileItem.getAsFile();
  if (!file) return;

  e.preventDefault();
  const ext = file.type === "image/png" ? ".png"
    : file.type === "image/jpeg" ? ".jpg"
    : file.type === "image/gif" ? ".gif"
    : file.type === "image/webp" ? ".webp" : "";
  const namedFile = new File([file], file.name || `pasted-image${ext}`, {
    type: file.type || "application/octet-stream",
    lastModified: Date.now()
  });
  setPendingFile(namedFile);
});

// Some browsers expose pasted files on the clipboard as DataTransfer files.
$("messageInput").addEventListener("drop", e => {
  const file = e.dataTransfer?.files?.[0];
  if (!file) return;
  e.preventDefault();
  setPendingFile(file);
});

$("messageForm").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("messageInput").value.trim();
  const file = pendingFile;

  if ((!text && !file) || !ws || ws.readyState !== WebSocket.OPEN) return;

  const sendButton = $("messageForm").querySelector(".send-btn");
  sendButton.disabled = true;

  try {
    let attachment = null;
    if (file) {
      $("fileStatus").textContent = `アップロード中: ${file.name || "貼り付けファイル"}`;
      attachment = await uploadChatFile(file);
    }

    ws.send(JSON.stringify({type:"message", text, attachment}));
    $("messageInput").value = "";
    $("fileStatus").textContent = "";
    setPendingFile(null);
  } catch (err) {
    alert(err.message);
  } finally {
    sendButton.disabled = false;
  }
});

document.querySelectorAll(".channel").forEach(el => {
  el.addEventListener("click", () => {
    const channel = el.dataset.channel;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    document.querySelectorAll(".channel").forEach(x => x.classList.remove("active"));
    el.classList.add("active");
    currentChannel = channel;
    $("channelName").textContent = el.textContent.replace("# ","");
    ws.send(JSON.stringify({type:"join_channel", channel}));
    $("messageInput").placeholder = `# ${channel} にメッセージを送信`;
  });
});

});

  await api("/api/logout", {method:"POST"}).catch(()=>{});
  account = null;
  if (ws) ws.close();
  $("profilePanel").classList.add("hidden");
  setAuthVisible(true);
  showLogin();
});
